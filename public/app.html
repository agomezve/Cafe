<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido · Cafendo</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/favicon.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#6F4E37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Cafendo">
</head>
<body>
    <div class="tarjeta">
        <img src="logo-slclab.png" alt="SLCLAB" width="100" class="mb-2.5 max-w-full rounded-lg">
        <h2 class="titulo">Hola <span id="nombreUsuario"></span>, ¿qué te pongo?</h2>

        <div id="avisoPreferencia" class="aviso hidden">
            <p id="textoPreferencia"></p>
            <div class="mt-2.5 flex gap-2.5">
                <button type="button" id="btnRepetirSi" class="boton-suave">Sí, lo mismo</button>
                <button type="button" id="btnRepetirNo" class="boton-suave">No, elijo otra cosa</button>
            </div>
        </div>

        <div id="avisoPedido" class="aviso hidden">
            <p id="textoPedido"></p>
            <div class="mt-2.5 flex gap-2.5">
                <button type="button" id="btnAnular" class="boton-suave">Anular mi pedido</button>
            </div>
        </div>

        <h3 class="apartado">☕ Cafés y bebidas</h3>
        <p class="pista">Puedes marcar varias.</p>
        <div id="listaBebidas" class="opciones"></div>
        <input type="text" id="otroTexto" placeholder="¿Qué quieres tomar?" maxlength="40" class="campo hidden">

        <h3 class="apartado">🥘 Pinchos</h3>
        <p class="pista">Puedes marcar varios.</p>
        <div id="listaPinchos" class="opciones"></div>
        <input type="text" id="otroPinchoTexto" placeholder="¿Qué pincho quieres?" maxlength="40" class="campo hidden">

        <button id="btnGuardar" class="boton">Guardar Pedido</button>
        <p id="avisoTurno" class="mt-3 text-center text-[0.95rem] text-[#7a6a5f]"></p>
        <hr class="my-6 h-px w-full border-0 bg-borde">
        <button id="btnResumen" class="boton bg-verde">Generar Resumen de este Turno</button>
        <button id="btnCerrarSesion" class="boton bg-pizarra">🚪 Cerrar Sesión</button>
    </div>
    <script src="catalogo.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
