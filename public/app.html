<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido - SLCLAB Café</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/favicon.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#6F4E37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Turno Café">
</head>
<body>
    <div class="tarjeta">
        <img src="logo-slclab.png" alt="SLCLAB" width="100" class="mb-2.5 max-w-full rounded-lg">
        <h2 class="titulo">Hola <span id="nombreUsuario"></span>, elige tu café:</h2>

        <div class="mb-5 flex w-full flex-col gap-3">
            <label class="opcion-cafe"><input type="radio" name="cafe" value="Solo"> Café Solo</label>
            <label class="opcion-cafe"><input type="radio" name="cafe" value="Con Leche"> Café con Leche</label>
            <label class="opcion-cafe"><input type="radio" name="cafe" value="Cortado"> Cortado</label>
            <label class="opcion-cafe"><input type="radio" name="cafe" value="Otro"> Otro</label>
        </div>

        <input type="text" id="otroTexto" placeholder="¿Qué quieres tomar?" maxlength="40" class="campo hidden">

        <p id="hieloStatus" class="mb-2.5 min-h-[26px] text-center text-[1.1rem] text-hielo"></p>

        <button id="btnGuardar" class="boton">Guardar Pedido</button>
        <p id="avisoTurno" class="mt-3 text-center text-[0.95rem] text-[#7a6a5f]"></p>
        <hr class="my-6 h-px w-full border-0 bg-borde">
        <button id="btnResumen" class="boton bg-verde">Generar Resumen de este Turno</button>
        <button id="btnCerrarSesion" class="boton bg-pizarra">🚪 Cerrar Sesión</button>
    </div>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
