<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen - SLCLAB Café</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/favicon.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#6F4E37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Turno Café">
</head>
<body>
    <div class="tarjeta">
        <div id="areaResumen" class="w-full rounded-xl bg-white p-[25px]">
            <div class="mb-5 text-center">
                <img src="logo-slclab.png" alt="SLCLAB Logo" width="120" class="mx-auto mb-2.5 max-w-full rounded-lg">
                <h2 class="titulo mt-2.5 mb-[5px]">Resumen del Turno</h2>
                <p id="totalPedidos" class="text-[1.2rem] font-bold text-cafe"></p>
            </div>
            <div id="listaPedidos"></div>
        </div>

        <button id="btnLimpiarTurno" class="boton mt-5 bg-rojo">🗑️ Finalizar Turno (Borrar lista)</button>
        <button id="btnVolver" class="boton bg-gris">Volver atrás</button>
        <button id="btnCerrarSesion" class="boton bg-pizarra">🚪 Cerrar Sesión</button>
    </div>
    <script src="auth.js"></script>
    <script src="resumen.js"></script>
</body>
</html>
