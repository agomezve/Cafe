<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SLCLAB Café</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/favicon.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#6F4E37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Turno Café">
</head>
<body>
    <div class="tarjeta">
        <img src="logo-slclab.png" alt="SLCLAB Logo" width="150" class="mb-2.5 max-w-full rounded-lg">
        <img src="logo-cafe.jpg" alt="Café Logo" width="100" class="mb-2.5 max-w-full rounded-lg">
        <h2 class="titulo">Turno del Café</h2>

        <input type="text" id="usuario" placeholder="Usuario" class="campo">
        <input type="password" id="password" placeholder="Contraseña" class="campo">
        <button id="btnLogin" class="boton">Iniciar Sesión</button>
    </div>
    <script src="auth.js"></script>
    <script src="acceso.js"></script>
</body>
</html>
